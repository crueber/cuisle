# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "cuisle"
arch: ${GOARCH}
platform: "linux"
version: "0.0.1"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Standups from your Jira boards"
vendor: "crueber"
homepage: "https://crueber.github.io/cuisle/"
license: "MIT"
release: "1"

contents:
  - src: "./bin/cuisle"
    dst: "/usr/local/bin/cuisle"
  - src: "./design/icon/png/cuisle-32.png"
    dst: "/usr/share/icons/hicolor/32x32/apps/cuisle.png"
  - src: "./design/icon/png/cuisle-48.png"
    dst: "/usr/share/icons/hicolor/48x48/apps/cuisle.png"
  - src: "./design/icon/png/cuisle-64.png"
    dst: "/usr/share/icons/hicolor/64x64/apps/cuisle.png"
  - src: "./design/icon/png/cuisle-128.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/cuisle.png"
  - src: "./design/icon/png/cuisle-256.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/cuisle.png"
  - src: "./design/icon/png/cuisle-512.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/cuisle.png"
  - src: "./build/linux/cuisle.desktop"
    dst: "/usr/share/applications/cuisle.desktop"

# Runtime dependencies for the GTK3 + WebKitGTK 4.1 stack that the Linux build uses (-tags gtk3, see
# build/linux/Taskfile.yml and docs/architecture.md §6.5). Matches build/ci/linux.Dockerfile.
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1

  # Arch Linux packages
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
