name: CI
# Installed into the GitHub mirror (crueber/cuisle) by scripts/publish-to-github.sh. Not used on Forgejo.
# Lint, test and build on Linux, macOS and Windows (docs/architecture.md §6.5).
# wails3 / task commands verified against Wails v3.1.0 (ADR 0001).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # a capacity-starved macOS queue fails clearly instead of hanging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev xvfb
      - name: Tools
        shell: bash
        run: |
          WAILS=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@"$WAILS"   # gtk3: Linux uses GTK 3 / WebKitGTK 4.1 (ADR 0001)
          go install github.com/go-task/task/v3/cmd/task@latest
      - name: Go
        shell: bash
        run: |
          CGO_ENABLED=0 go vet -tags purego ./...
          go run ./scripts/layercheck
          if [ "$RUNNER_OS" = "Windows" ]; then CGO_ENABLED=0 go test -tags purego ./... -count=1; else go test -race -tags gtk3 ./... -count=1; fi
      - name: Frontend
        shell: bash
        run: |
          (cd frontend && npm ci)
          task bindings && task tokens
          cd frontend && npx tsc --noEmit && npx eslint src scripts tests && npx vitest run && npx vite build && npx size-limit
      - name: Playwright (perf + a11y + screenshots, mock mode)
        if: runner.os == 'Linux'
        working-directory: frontend
        env:
          PERF_CPU_THROTTLE: "2" # shared runners are ~2x slower than the 4x-throttled reference machine (tests/perf/measure.ts)
        run: npx playwright install --with-deps chromium && npx playwright test tests/perf tests/a11y  # screens: macOS-only baselines (tests/screens/README.md)
      - name: Package smoke
        shell: bash
        run: |
          task package
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a ./bin/cuisle --bench-startup --fake-jira; fi
