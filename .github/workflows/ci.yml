name: CI
# Installed into the GitHub mirror (crueber/cuisle) by scripts/publish-to-github.sh. Not used on Forgejo.
# Lint, test and build on Linux, macOS and Windows (docs/architecture.md §6.5).
# wails3 / task commands verified against Wails v3.1.0 (ADR 0001).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # a capacity-starved macOS queue fails clearly instead of hanging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev xvfb dbus-x11
      - name: Windows deps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # makensis isn't on the hosted image (exit 127 in windows:create:nsis:installer)
          # The community feed sometimes answers 503, so retry, then fail clearly if makensis still isn't there.
          for ($i = 1; $i -le 4; $i++) {
            choco install nsis -y --no-progress
            if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") { break }
            Write-Host "nsis install attempt $i failed; retrying in 20 s"
            Start-Sleep -Seconds 20
          }
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { throw "NSIS could not be installed" }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Tools
        shell: bash
        run: |
          WAILS=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@"$WAILS"   # gtk3: Linux uses GTK 3 / WebKitGTK 4.1 (ADR 0001)
          go install github.com/go-task/task/v3/cmd/task@latest
      - name: Go
        shell: bash
        run: |
          CGO_ENABLED=0 go vet -tags purego ./...
          go run ./scripts/layercheck
          if [ "$RUNNER_OS" = "Windows" ]; then CGO_ENABLED=0 go test -tags purego ./... -count=1; else go test -race -tags gtk3 ./... -count=1; fi
      - name: Frontend
        shell: bash
        run: |
          (cd frontend && npm ci)
          task bindings && task tokens
          cd frontend && npx tsc --noEmit && npx eslint src scripts tests && npx vitest run && npx vite build && npx size-limit
      - name: Playwright (a11y, mock mode)
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npx playwright test tests/a11y  # screens: macOS-only baselines (tests/screens/README.md)
      - name: Playwright (perf budgets, report-only on shared runners)
        if: runner.os == 'Linux'
        working-directory: frontend
        # Chris's decision (2026-11-24): shared runners vary run to run, so timing budgets are reported here but don't
        # fail the build. They're enforced locally (`task e2e`) before every merge (testing.md §5).
        continue-on-error: true
        env:
          PERF_CPU_THROTTLE: "2" # runners are ~2x slower than the 4x-throttled reference machine (tests/perf/measure.ts)
        run: npx playwright test tests/perf
      - name: Package smoke
        shell: bash
        env:
          # WebKitGTK 2.50 on the GPU-less runner doesn't paint under Xvfb with its DMA-BUF/compositing renderer
          # ("frontend did not report first-view"); force software rendering for the smoke run.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          task package
          if [ "$RUNNER_OS" = "Linux" ]; then
            # WebKitGTK's web process sandbox (bubblewrap) needs unprivileged user namespaces, which the runner's
            # AppArmor policy blocks: the window never appeared (no first-view, no asset requests). Forgejo's job runs
            # as root in a container and is unaffected.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            # GTK can stall waiting for the accessibility bus when there's no D-Bus session ("AT-SPI: Error
            # retrieving accessibility bus address" was the last line before the 15 s timeout): give the run its own
            # session bus, turn the AT bridge off, and use a 24-bit screen. Debug logs make a failure explain itself.
            NO_AT_BRIDGE=1 CUISLE_LOG=debug dbus-run-session -- \
              xvfb-run -a -s "-screen 0 1920x1080x24" ./bin/cuisle --bench-startup --fake-jira
          fi
