# GitHub Pages for the project page (site/ + the README screenshots + the app's fonts), assembled by
# scripts/site/build.sh. Installed into .github/workflows/ by scripts/publish-to-github.sh; Pages must be set to
# "GitHub Actions" as its source (gh api -X POST repos/crueber/cuisle/pages -f build_type=workflow).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: sh scripts/site/build.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
